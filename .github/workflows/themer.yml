name: Themer
on: workflow_dispatch
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Look at the plugin project
        run: |
          echo "=== ROOT"; ls
          echo "=== SETTINGS"; cat settings.gradle.kts 2>/dev/null | head -60
          echo "=== ROOT BUILD"; cat build.gradle.kts 2>/dev/null | head -80
          echo "=== THEMER FILES"; find Themer -type f | head -80
          echo "=== THEMER BUILD"; cat Themer/build.gradle.kts 2>/dev/null
          for f in $(grep -rl -E "getColor|Resources|ColorStateList|setColorFilter|patch" Themer --include=*.kt --include=*.java | head -20); do
            echo; echo "################ $f"; cat "$f"
          done
      - name: Look at the Xposed module
        run: |
          git clone --depth 1 https://github.com/Aliucord/DiscordThemer module
          cd module
          echo "=== FILES"; find . -type f -not -path "./.git/*" | head -80
          grep -rn "setReplacement\|handleInitPackageResources\|initZygote\|handleLoadPackage" --include=*.java . | head -30
          for f in $(grep -rl -E "setReplacement|handleInitPackageResources|handleLoadPackage" --include=*.java . | head -6); do
            echo; echo "################ $f"; cat "$f"
          done
      - name: Build Themer
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew Themer:make --stacktrace
          find . -name "Themer*.zip" | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Themer
          path: |
            Themer/build/*.zip
          if-no-files-found: warn
